[logconfig]
disable_existing_loggers = True

[loggers]
keys = root

[formatters]
keys = standard, colorized, json, tg

[formatter_standard]
format = %(asctime)s [%(process)s] %(levelname)-8s | %(name)s:%(funcName)s:%(lineno)s - %(message)s

[formatter_colorized]
class = src.loggers.config.ColorizedFormatter

[formatter_json]
class = src.loggers.config.JSONFormatter

[formatter_tg]
class = src.loggers.config.TGFormatter

[handlers]
keys = console, file_debug, file_json, tg_crit

[handler_console]
class = logging.StreamHandler
level = INFO
formatter = colorized
stream = ext://sys.stdout

[handler_file_debug]
class = logging.handlers.RotatingFileHandler
level = DEBUG
formatter = standard
maxBytes = 5000000
backupCount = 50
args = ('logs/app.log',)
encoding = utf8

[handler_file_json]
class = logging.handlers.RotatingFileHandler
level = WARNING
formatter = json
maxBytes = 5000000
backupCount = 3
args = ('logs/app.jsonl',)
encoding = utf8

[handler_tg_crit]
class = src.loggers.handlers.TelegramLogHandler
level = CRITICAL
formatter = tg

[logger_root]
level = NOTSET
handlers = console, file_debug, file_json, tg_crit
