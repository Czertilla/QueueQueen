---
ru:
  already_in_queue: пользователь @%{username} уже в очереди
  empty: пусто
  head_ntf: |-
    сейчас твоя очередь!
    В очереди #%{queue_id}
    Не забудьте выйти из очереди
  help_info_regul: |-
    <b>Справочная информация</b>
    С помощью этого бота вы можете создавать электронные очереди и управлять ими в своих чатах. Для каждого чата существует отдельная очередь.

    <b>Основные команды:</b>
    <blockquote>  - /help – Показать справочную информацию
      - /start – (<a href="%{link}">в личном чате</a>) Включить уведомления, когда подойдет ваша очередь
    </blockquote>
    <b>Команды очереди:</b>
    <i>(Доступны в чате с инициированной очередью)</i>
    <blockquote>  - /join – Встать в очередь в текущем чате
      - /quit – Выйти из очереди в текущем чате
      - /check – Показать информацию о текущей очереди
    </blockquote>
  help_info_admin: |-

    <b>Команды администратора:</b>
    <i>(Доступны в чате с инициированной очередью, где у вас есть права администратора)</i>
    <blockquote>  - /start - (в групповом чате) Инициализировать очередь для вашего чата
      - /clear – Очистить очередь в текущем чате
      - <code>/kick @u</code> – Удалить пользователя из очереди.
        Целевого пользователя можно идентифицировать по:
        • Его имени пользователя (скопируйте его из списка, полученного с помощью /check)
        • Его порядковому номеру в очереди (также из списка /check)
    </blockquote>
  help_info_footer: |-
  
    QueueQueen bot <a href="https://github.com/Czertilla/QueueQueen">%{ver}</a>
    Разработано с ❤️ <a href="https://github.com/Czertilla">Czertilla</a>
  invalid_callback_data: это сообщение содержит недействительные данные обратного вызова
