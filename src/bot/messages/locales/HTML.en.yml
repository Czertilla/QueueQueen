---
en:
  already_in_queue: user @%{username} already in queue
  empty: empty
  head_ntf: |-
    it`s your turn now! 
    In queue #%{queue_id}
    Don`t forget quit queue
  help_info_regul: |-
    <b>Help Information</b>
    With this bot you can crate and manage electronic queues in your chats. There is separate queue for each chat

    <b>Regular Commands:</b>  
      - /help – Show help information
      - /start – (<a href="%{link}">in personal chat</a>) Enable notifications when you reach your turn in the queue  

    <b>Queue Commands:</b>  
    <i>(Available in a chat with an initiated queue)</i>  
      - /join – Join the queue in the current chat  
      - /quit – Leave the queue in the current chat  
      - /check – Show information about the current queue
    
  help_info_admin: |-
    <b>Admin Commands:</b>  
    <i>(Available in a chat with an initiated queue where you have admin rights)</i>  
      - /start - (in group chat) Initialize queue for your chat
      - /clear – Clear the queue in the current chat  
      - <code>/kick @u</code> – Remove a user from the queue.  
        The target user can be identified by:
        • Their username (copy it from the list obtained via /check)  
        • Their position number in the queue (also from the /check list)  
        
  help_info_footer: |-
    QueueQueen bot <a href="https://github.com/Czertilla/QueueQueen">%{ver}</a>
    Developed with ❤️ by <a href="https://github.com/Czertilla">Czertilla</a>
  invalid_callback_data: this message contains invalid callback data
  new_position_ntf: '@%{username}, now your position is %{pos_num}'
  new_queue: 'New queue created (id: #%{queue_id})'
  new_queue_err: some problem with creating new queue
  no_queue: no queue in this chat
  not_admin_alert: |-
    @%{username}, you are not admin. 
    Add this bot to chat, where you`re admin
